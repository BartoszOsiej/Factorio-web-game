name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 12 * * 3"
permissions: read-all
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6d786de4d6f3531a740e445b53a42b622bbbace8
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@6d786de4d6f3531a740e445b53a42b622bbbace8
